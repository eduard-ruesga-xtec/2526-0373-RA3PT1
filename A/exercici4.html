<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registre de Verdures</title>
    <style>
        /* CSS Bàsic */
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            line-height: 1.6;
            transition: background-color 0.3s, color 0.3s;
        }

        .formulari {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        input {
            margin: 5px;
            padding: 8px;
        }

        button {
            margin: 5px;
            padding: 8px 15px;
            cursor: pointer;
        }

        #llistaVerdures {
            margin-top: 20px;
        }

        #imgValidacio {
            width: 150px;
            height: 150px;
            display: block;
            margin-top: 10px;
            object-fit: cover;
            border: 1px solid #ddd;
        }

        /* Estils per al Mode Fosc */
        .dark-mode {
            background-color: black;
            color: white;
        }
        
        .dark-mode .formulari {
            border-color: #555;
        }

        .hide{
            display: none;
        }

        .visible{
            display: block;
        }
    </style>
</head>
<body>

    <h1>Registre d'Entrada de Verdures</h1>

    <div class="formulari">
        <input type="text" id="nomVerdura" placeholder="Nom de la verdura">
        <input type="number" id="kg" placeholder="Kilograms (kg)">
        <input type="number" id="preu" placeholder="Preu (€/kg)" step="0.01">
        <br>
        <button id="btnRegistrar">Registrar</button>
        <button id="btnNetejar">Netejar llista</button>
        <button id="btnValidar">Validar</button>
        <button id="btnModeFosc">Mode fosc</button>
    </div>

    <h3>Llista de Registres:</h3>
    <ul id="llistaVerdures"></ul>

    <p><strong>Cost Total (sense IVA): </strong><span id="totalCost">0</span> euros</p>

    <img id="imgValidacio" src="https://via.placeholder.com/150?text=Sense+Validar" alt="Estat validació">

    <script>

        const IVA = 0.21; 
        const EurosMsg = " euros";
        //Els events es poden realitzar directament des de el HTML o des de JS.

        //Capturem els elements necessàris del DOM per a treballar i els guardem en constants. 
        const inputNom = document.getElementById('nomVerdura'); //-> Fixeu-vos que el nom de la constant fa referencia al tipus i el nom de l'element. En aquest cas input, així podem diferenciar diferents entre elements o dades.
        const inputKg = document.getElementById('kg');
        const inputPreu = document.getElementById('preu');

        const btnRegistrar = document.getElementById('btnRegistrar');
        const btnNetejar = document.getElementById('btnNetejar');
        const btnValidar = document.getElementById('btnValidar');
        const btnModeFosc = document.getElementById('btnModeFosc');

        const llistaVerdures = document.getElementById('llistaVerdures');
        const spanTotalCost = document.getElementById('totalCost');
        const imgValidacio = document.getElementById('imgValidacio');

        let costAcumulatTotal = 0;
        
        //Registrem els events de botons
        btnRegistrar.addEventListener('click', registrarProducte);  //Apartat 4.A, dins es troba la resolució 4.B
        btnNetejar.addEventListener('click', netejaLlista);         //Apartat 4.C
        btnValidar.addEventListener('click', validateTotalCost);    //Apartat 4.D
        btnModeFosc.addEventListener('click', darkModeToggle);      //Apartat 4.E

        //Funcions implementades que seran cridades pels events:
        function registrarProducte(){
            //Capturem les DADES:
            const verdura = inputNom.value.trim();  //Amb value mirem la dada que que s'ha escrit. Amb trim() netejem espais innecessaris.
            const kg      = parseFloat(inputKg.value);   //No cal trim, és un input de type number, por tant, no es poden afegir espais. ParseFloat intentarà trasnformar la dada a decimal
            const preu    = parseFloat(inputPreu.value);

            //Comprobem que l'event funciona fent un console.log
            console.log("registrarProductes disparat!");

            //Validem que els camps estan plens. No hi ha validació a l'HTML, per tant la fem per JS
            if(verdura ==="" || verdura == null || isNaN(kg) || isNaN(preu)){
                alert("Error! Camps buits, si us plau, omple tots el camps abans de registrar.");
            }else{
                //Si les dades són correctes procedim a fer els càlculs.
                //Dins de l'else ens asegurem que no es fan els càlculs amb NaNs i provoqui errors.

                //Comprobem que entrem a la zona de càlculs correctament
                //console.log("Camps a registrar correctes!");

                //Càlculs
                let cost = kg * preu;
                let ivaCalculat = cost * IVA;

                //Crear el nou element de la llista (li)
                let nouElementLlista = document.createElement("li"); 
                nouElementLlista.textContent = `${verdura}, ${kg}kg, ${preu} euros/kg. Pagar: ${cost} euros. IVA: ${ivaCalculat} euros`;

                //Ara afegim l'element li nou a la llista (ul) la tenim guardada a llistaVerdures.
                llistaVerdures.appendChild(nouElementLlista);  //AppendChild afegeix el que pasem per varlor (el que pasem per parentesis) com a fill jeràrquic (a dins).


                /*** Resolució de l'apartat 4.B ***********************************/
                //Ara actualitzem el cost total sense iva a la variable acumuladora
                costAcumulatTotal = costAcumulatTotal + cost;

                //Actualitzem l'element d'HTML on mostra el costTotal
                spanTotalCost.textContent = costAcumulatTotal; //El textContent és la propietat del text dins de l'etiqueta. En aquest cas, un SPAN. Per ficar un nou valor ho fem amb =
                /******************************************************************/


                //Aquest pas no es obligatori però millora la usabilitat: netejar els camps dels inputs
                inputNom.value = "";
                inputKg.value  = "";
                inputPreu.value= "";
            }
        }

        //Programació de l'apartat 4.C
        function netejaLlista(){
            llistaVerdures.innerHTML = "";  //InnerHTML és on es guarda tot el que hi ha dins de l'etiqueta guardada.
        }

        //Programació de l'apartat 4.D
        function validateTotalCost(){
            if(costAcumulatTotal > 100){ //Com costAcumuatTotal ha sigut creada fora de cada funció podem consultar-la en qualsevol moment.
                imgValidacio.src = "img/img1.jpg";  //src -> és l'atribut de l'imatge que indica la ruta.
            }else{
                imgValidacio.src = "img/img2.jpeg";
            }
        }

        //Programació de l'apartat 4.E
            //El resoldré fent més del que demana l'enunciat. Fem que al tornar a apretar tornem al mode anterior amb "toggle" que afegeix una classe CSS si l'element no la té i la elimina si ja la tenia.
            //Canviaré el text del botó.
        function darkModeToggle(){
            //Afegrirem i treurem (toggle) la classe CSS .dark-mode al body directament.
            document.body.classList.toggle("dark-mode"); //No cal canviar cap element més, revisar les dues classes CSS.
            if(btnModeFosc.textContent == "Mode fosc"){
                btnModeFosc.textContent = "Mode clar";
            }else{
                btnModeFosc.textContent = "Mode fosc";
            }
        }

    </script>

</body>
</html>
